name: Build Windows x64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download CEF SDK
        shell: pwsh
        run: |
          $url = "https://cef-builds.spotifycdn.com/cef_binary_131.3.5%2Bg0ca5c37%2Bchromium-131.0.6778.265_windows64_minimal.tar.bz2"
          Write-Host "Downloading CEF minimal SDK..."
          Invoke-WebRequest -Uri $url -OutFile cef_sdk.tar.bz2 -UseBasicParsing
          tar xf cef_sdk.tar.bz2
          $d = Get-ChildItem -Directory -Filter "cef_binary_*" | Select -Object -First 1
          Rename-Item $d.FullName cef_binary
          Write-Host "CEF ready."

      - name: Build
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $p = "DouyinSessionTool-Windows-x64"
          New-Item -ItemType Directory -Path $p -Force
          Copy-Item "build/Release/DouyinSessionTool.exe" "$p/"
          Copy-Item "cef_binary/Release/*.dll" "$p/"
          Copy-Item "cef_binary/Resources/*.pak" "$p/"
          Copy-Item "cef_binary/Resources/*.dat" "$p/"
          Compress-Archive -Path "$p/*" -DestinationPath "$p.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DouyinSessionTool-Windows-x64
          path: DouyinSessionTool-Windows-x64.zip
